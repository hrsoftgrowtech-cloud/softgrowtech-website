<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Reset | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="portal-body"><main class="portal-wrap"><div style="max-width:520px;margin:50px auto"><div class="portal-card"><div class="portal-kicker">Account Recovery</div><h1>Forgot Password?</h1><p>Enter your registered Gmail. A secure reset link will be sent to your email.</p><form id="resetRequest" class="form-grid"><div class="field full"><label>Registered Gmail</label><input id="resetEmail" type="email" required></div><div class="field full"><button class="portal-btn primary">Send Reset Link →</button></div></form><hr style="border:0;border-top:1px solid var(--portal-border);margin:22px 0"><h3>Create New Password</h3><form id="resetChange" class="form-grid"><div class="field full"><label>New Password</label><input id="newPass" type="password" minlength="8" maxlength="8"></div><div class="field full"><label>Confirm Password</label><input id="confirmPass" type="password" minlength="8" maxlength="8"></div><div class="field full"><button class="portal-btn secondary">Update Password</button></div></form><div class="password-rules">Exactly 8 characters • 1 capital • 1 number • 1 special from # @ ? ! /</div><p><a href="student-login.html">Back to Login</a></p></div></div></main><div id="toast" class="toast"></div><script src="portal.js"></script></body></html>
