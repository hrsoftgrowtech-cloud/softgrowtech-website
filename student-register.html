<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="portal-body"><header class="portal-top"><div class="portal-nav"><a class="portal-brand" href="index.html"><img src="assets/softgrowtech-logo.png"><span>Soft<span>Grow</span>Tech</span></a><a class="portal-btn secondary" href="student-login.html">Student Login</a></div></header><main class="portal-wrap"><div style="max-width:700px;margin:20px auto"><div class="portal-card"><div class="portal-kicker">Start Your Journey</div><h1>Student Registration</h1><p>Create your permanent SoftGrowTech Student ID and select your interest domain.</p><form id="registerForm" class="form-grid"><div class="field"><label>Full Name</label><input id="name" required autocomplete="name"></div><div class="field"><label>Registered Gmail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Phone / WhatsApp</label><input id="phone" required inputmode="tel"></div><div class="field"><label>Interest Domain</label><select id="domain" required></select></div><div class="field full"><div class="help-note">Your first-login temporary password will follow the format <strong>SGT@First3LettersLast4Digits</strong>. Example: Rahul + 3210 → <strong>SGT@Rah3210</strong>.</div></div><div class="field full"><label>Temporary password preview</label><input id="tempPreview" readonly></div><div class="field full"><button class="portal-btn primary" type="submit">Create Registration →</button></div></form></div></div></main><div id="toast" class="toast"></div><script src="portal.js"></script></body></html>
