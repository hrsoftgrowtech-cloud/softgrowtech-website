<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Ambassador | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.amb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.amb-link{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.amb-link input{flex:1;min-width:220px}.amb-tier{border:1px solid #e2e8f0;border-radius:14px;padding:15px;background:#fff}.amb-tier.current{border-color:#93c5fd;background:#f8fbff}.amb-tier.done{border-color:#bbf7d0;background:#f0fdf4}.amb-progress{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:10px 0}.amb-progress>span{display:block;height:100%;background:#2563eb;border-radius:inherit}.amb-table-wrap{overflow:auto}.amb-table{width:100%;border-collapse:collapse;min-width:720px}.amb-table th,.amb-table td{padding:11px 10px;border-bottom:1px solid #e2e8f0;text-align:left}.amb-table th{font-size:12px;text-transform:uppercase;color:#64748b}.amb-rules li{margin:8px 0}</style><style>.sgt-icon{width:18px;height:18px;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.icon-heading{display:flex;align-items:center;gap:8px}.icon-inline{display:inline-flex;align-items:center;gap:7px}.icon-btn{display:inline-flex;align-items:center;gap:8px}.share-panel{margin-top:14px;border:1px solid #dbe4ef;border-radius:14px;padding:14px;background:#f8fbff}.share-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.share-close{border:0;background:#fff;border:1px solid #dbe4ef;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:#475569}.share-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.share-option{min-height:62px;border:1px solid #dbe4ef;background:#fff;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#334155;font:inherit;font-weight:750;cursor:pointer}.share-option:hover{border-color:#93c5fd;background:#f8fbff}.share-option .sgt-icon{width:22px;height:22px}.share-option.whatsapp{color:#128c7e}.share-option.telegram{color:#168acd}.share-option.linkedin{color:#0a66c2}.share-option.email{color:#475569}@media(max-width:650px){.share-options{grid-template-columns:repeat(2,minmax(0,1fr))}.amb-link input{min-width:160px}}</style></head><body class="portal-body"><header class="portal-top"><div class="portal-nav"><a class="portal-brand" href="index.html"><img src="assets/softgrowtech-logo.png" alt="SoftGrowTech"><span>Soft<span>Grow</span>Tech</span></a><div class="portal-nav-actions"><a class="portal-btn secondary" href="portal.html">Back to Dashboard</a><button class="portal-btn secondary" id="ambLogout">Logout</button></div></div></header><main class="portal-wrap" id="ambassadorRoot"><div class="portal-card"><p>Loading Ambassador Dashboard…</p></div></main><div id="toast" class="toast"></div><script src="ambassador.js"></script></body></html>
