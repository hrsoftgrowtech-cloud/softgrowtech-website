<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="icons.css">
</head><body class="portal-body">
<header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/softgrowtech-logo.png" alt="SoftGrowTech logo"><span>Soft<span>Grow</span>Tech</span></a><button class="menu-btn" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><ul class="nav-links" id="navLinks"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="how-it-works.html">How It Works</a></li><li><a href="internships.html">Internships</a></li><li><a href="projects.html">Projects</a></li><li><a href="services.html">Services</a></li><li><a class="nav-apply" href="student-login.html">Register | Login <span class="arrow">→</span></a></li></ul></div></header>
<main class="portal-wrap"><div style="max-width:520px;margin:34px auto"><div class="portal-card"><div class="portal-kicker">Student Portal</div><h1>Welcome back</h1><form id="loginForm" class="form-grid"><div class="field full"><label>Student ID / Gmail</label><input id="loginId" required autocomplete="username"></div><div class="field full"><label>Password</label><div class="password-field"><input id="password" type="password" required autocomplete="current-password"><button type="button" class="password-eye" id="loginPasswordToggle" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div></div><div class="field full"><button class="portal-btn primary" type="submit">Login →</button></div></form><div style="margin-top:12px;text-align:center"><a href="student-register.html" style="color:#2563eb;font-weight:800;text-decoration:none">Create a new registration for free</a></div><div style="margin-top:10px;text-align:center"><a href="reset-password.html" style="color:#64748b;font-weight:700;text-decoration:none">Forgot Password?</a></div></div></div></main><div id="toast" class="toast"></div><script src="portal.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('.menu-btn'),n=document.getElementById('navLinks');if(b&&n)b.onclick=()=>n.classList.toggle('open')});</script><script>
document.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById('password'),toggle=document.getElementById('loginPasswordToggle');
  if(!input||!toggle)return;
  const open='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  const closed='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2C11.1 6.1 11.5 6 12 6c6 0 9.5 6 9.5 6a16.8 16.8 0 0 1-3.1 3.5M7.2 7.8C4.2 9.1 2.5 12 2.5 12s3.5 6 9.5 6 2.5-.3 3.6-.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  toggle.onclick=()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.innerHTML=show?open:closed;toggle.setAttribute('aria-label',show?'Hide password':'Show password');toggle.title=show?'Hide password':'Show password'};
});
</script></body></html>
