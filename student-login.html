<main class="portal-wrap student-login-wrap"><div class="student-login-shell"><div class="portal-card student-login-card"><div class="portal-kicker">Student Portal</div><h1>Welcome back</h1><form id="loginForm" class="form-grid"><div class="field full"><label>Student ID / Gmail</label><input id="loginId" required autocomplete="username"></div><div class="field full"><label>Password</label><div class="password-field"><input id="password" type="password" required autocomplete="current-password"><button type="button" class="password-eye" id="loginPasswordToggle" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div></div><div class="field full"><button class="portal-btn primary" type="submit">Login →</button></div></form><div style="margin-top:12px;text-align:center"><a href="student-register.html" style="color:#2563eb;font-weight:800;text-decoration:none">Create a new registration for free</a></div><div style="margin-top:10px;text-align:center"><a href="reset-password.html" style="color:#64748b;font-weight:700;text-decoration:none">Forgot Password?</a></div></div></div></main><div id="toast" class="toast"></div><script src="script.js"></script><script src="portal.js"></script><script></script><script>
(()=>{const input=document.getElementById('password'),toggle=document.getElementById('loginPasswordToggle');if(!input||!toggle)return;
const open='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const closed='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7s-3.1 3.9-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.1-.9"/></svg>';
toggle.innerHTML=closed;toggle.setAttribute('aria-label','Show password');toggle.title='Show password';toggle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const show=input.type==='password';input.type=show?'text':'password';toggle.innerHTML=show?open:closed;toggle.setAttribute('aria-label',show?'Hide password':'Show password');toggle.title=show?'Hide password':'Show password';});})();
</script><style>.student-login-page{height:auto!important;min-height:100vh;overflow:auto!important}.student-login-page .portal-wrap{height:auto!important;min-height:calc(100vh - 76px);overflow:visible!important;display:block!important;padding:44px 24px 70px!important}.student-login-shell{width:min(100%,560px);margin:0 auto}.student-login-card{padding:clamp(28px,4vw,48px);border-radius:24px;box-shadow:0 22px 65px rgba(15,23,42,.10)}.student-login-card h1{font-size:clamp(32px,4vw,42px);margin:10px 0 28px}.student-login-card .field input{min-height:50px}.student-login-card .portal-btn{min-height:50px;width:100%}.student-login-card .password-eye{width:44px;min-width:44px;border:0;background:transparent;box-shadow:none;padding:0}.student-login-card .password-eye svg{width:21px;height:21px}@media(max-width:600px){.student-login-page .portal-wrap{padding:26px 14px 45px!important}.student-login-card{padding:24px 18px}}</style><style>.student-login-page{height:auto!important;min-height:100vh;overflow:auto!important}.student-login-page .portal-wrap{height:auto!important;min-height:calc(100vh - 76px);overflow:visible!important;display:block!important;padding:44px 24px 70px!important}.student-login-shell{width:min(100%,560px);margin:0 auto}.student-login-card{padding:clamp(28px,4vw,48px);border-radius:24px;box-shadow:0 22px 65px rgba(15,23,42,.10)}.student-login-card h1{font-size:clamp(32px,4vw,42px);margin:10px 0 28px}.student-login-card .field input{min-height:50px}.student-login-card .portal-btn{min-height:50px;width:100%}.student-login-card .password-eye{width:44px;min-width:44px;border:0;background:transparent;box-shadow:none;padding:0}.student-login-card .password-eye svg{width:21px;height:21px}@media(max-width:600px){.student-login-page .portal-wrap{padding:26px 14px 45px!important}.student-login-card{padding:24px 18px}}.student-login-page .header{position:sticky!important;top:0;z-index:1100}.student-login-page .student-login-wrap{min-height:calc(100vh - 76px);display:fl
