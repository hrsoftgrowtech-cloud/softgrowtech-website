<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Referral Account | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body.referral-register-page{height:auto!important;min-height:100vh;overflow:auto!important}.referral-register-page .portal-wrap{height:auto!important;min-height:calc(100vh - 64px);overflow:visible!important;display:block!important;padding:34px 18px 60px!important}.ref-register-card{width:min(100%,760px);margin:0 auto;padding:clamp(24px,4vw,42px);border:1px solid #cfe0ff;border-radius:24px;background:linear-gradient(145deg,#fff,#f4f8ff);box-shadow:0 20px 60px rgba(30,64,175,.11)}.ref-register-icon{font-size:34px;margin-bottom:12px}.ref-register-card h1{margin:8px 0 10px;font-size:clamp(28px,4vw,38px)}.ref-register-card .portal-btn{width:100%;min-height:50px;background:linear-gradient(110deg,#1d4ed8,#3b82f6);box-shadow:0 9px 24px rgba(37,99,235,.2);transition:transform .18s ease}.ref-register-card .portal-btn:hover{transform:translateY(-2px)}#registerMessage{min-height:20px;color:#b91c1c;font-size:13px}.ref-register-card .back-link{display:inline-block;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:800}</style></head><body class="portal-body referral-register-page"><header class="portal-top"><div class="portal-nav"><a class="portal-brand" href="index.html"><img src="assets/softgrowtech-logo.png" alt="SoftGrowTech"><span>Soft<span>Grow</span>Tech</span></a><a class="portal-btn secondary" href="my-referral.html">Referral Login</a></div></header><main class="portal-wrap"><section class="ref-register-card"><div class="ref-register-icon" aria-hidden="true">🎁</div><div class="portal-kicker">SOFTGROWTECH REFERRAL PROGRAM</div><h1>Create Your Referral Account</h1><p class="portal-muted">Enter your details to create your referral partner account. Your Referral ID and dashboard will be provided after successful account creation.</p><form id="refRegisterForm" class="form-grid"><div class="field full"><label for="partnerName">Full Name</label><input id="partnerName" required autocomplete="name" placeholder="Enter your full name"></div><div class="field full"><label for="partnerEmail">Email Address</label><input id="partnerEmail" type="email" required autocomplete="email" placeholder="name@example.com"></div><div class="field full"><label for="partnerPhone">WhatsApp Number</label><input id="partnerPhone" type="tel" required autocomplete="tel" placeholder="Enter your WhatsApp number"></div><div class="field full"><p id="registerMessage" role="status" aria-live="polite"></p><button class="portal-btn primary" id="createNow" type="submit">Create Now →</button></div></form><a class="back-link" href="my-referral.html">← Back to Referral Login</a></section></main><script>const SGT_URL='https://syoqukavgvrdhwxatdav.supabase.co',SGT_KEY='sb_publishable_yUuacAdfZy3k-_Zve5QOZA_6eLh9FeZ';const sb=window.supabase.createClient(SGT_URL,SGT_KEY);document.getElementById('refRegisterForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('partnerName').value.trim(),email=document.getElementById('partnerEmail').value.trim().toLowerCase(),phone=document.getElementById('partnerPhone').value.trim(),msg=document.getElementById('registerMessage'),btn=document.getElementById('createNow');if(!name||!email||!phone){msg.textContent='Please complete all fields.';return}btn.disabled=true;btn.textContent='Creating Account…';msg.textContent='';try{const {data,error}=await sb.rpc('sgt_create_referral_partner_self',{p_name:name,p_email:email,p_phone:phone});if(error||!data||data.error)throw new Error(error?.message||data?.error||'Unable to create your referral account.');const token=data.referral_id||data.portal_token;if(!token)throw new Error('Account was created, but the Referral ID was not returned. Please contact support before trying again.');sessionStorage.setItem('sgt_referral_credentials',JSON.stringify({token,access:''}));location.href='my-referral.html'}catch(err){msg.textContent=err.message||'Unable to create your referral account.';btn.disabled=false;btn.textContent='Create Now →'}});</script></body></html>
