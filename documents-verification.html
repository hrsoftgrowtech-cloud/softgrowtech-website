<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Documents Verification | SoftGrowTech</title>

  <meta name="description"
    content="Verify official certificates, offer letters, experience letters and other documents issued by SoftGrowTech.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --dark: #0b1220;
      --text: #172033;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1180px;
      margin: auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      color: var(--dark);
    }

    .logo span {
      color: var(--primary);
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      display: grid;
      place-items: center;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a {
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-apply {
      background: var(--primary);
      color: white !important;
      padding: 11px 18px;
      border-radius: 8px;
    }

    .nav-apply:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .menu-btn {
      display: none;
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    /* HERO */
    .verification-hero {
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(37,99,235,0.18),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #f8fbff 0%,
          #eef5ff 100%
        );

      padding: 85px 22px 80px;
    }

    .verification-container {
      max-width: 1180px;
      margin: auto;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 55px;
      align-items: center;
    }

    /* LEFT CARD */
    .info-card {
      background: linear-gradient(
        145deg,
        #0b1220,
        #172554
      );

      color: white;
      border-radius: 24px;
      padding: 42px;
      box-shadow:
        0 25px 60px rgba(15,23,42,0.18);
    }

    .eyebrow {
      color: #60a5fa;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .info-card h1 {
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .info-card h1 span {
      color: #60a5fa;
    }

    .info-card > p {
      color: #cbd5e1;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .document-list {
      list-style: none;
    }

    .document-list li {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 16px;
      color: #e2e8f0;
      font-size: 14px;
    }

    .check {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: rgba(96,165,250,0.16);
      color: #60a5fa;
      display: grid;
      place-items: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* VERIFICATION BOX */
    .verify-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 42px;
      box-shadow:
        0 20px 50px rgba(15,23,42,0.08);
    }

    .verify-box h2 {
      font-size: 30px;
      color: var(--dark);
      margin-bottom: 10px;
    }

    .verify-box-intro {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 9px;
      color: var(--dark);
    }

    .form-group input {
      width: 100%;
      padding: 16px 17px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      transition: 0.25s ease;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.10);
    }

    .verify-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 23px;
    }

    /* BUTTON */
    .verify-btn {
      border: none;
      width: 100%;
      padding: 15px 22px;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .verify-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow:
        0 12px 25px rgba(37,99,235,0.25);
    }

    .verify-btn:active {
      transform: translateY(-1px);
    }

    /* RESULT */
    .verify-result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 14px;
    }

    .verify-result.show {
      display: block;
    }

    /* FOOTER */
    footer {
      background: #070d18;
      color: white;
      padding: 45px 22px 25px;
    }

    .footer-container {
      max-width: 1180px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 30px;
      align-items: center;
