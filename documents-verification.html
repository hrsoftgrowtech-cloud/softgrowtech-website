<div class="verify-form">

  <label for="docid">Student / Letter ID</label>

  <input
    type="text"
    id="docid"
    name="docid"
    required
    placeholder="e.g. SGT-26X-0001"
    autocomplete="off"
  >

  <p class="verify-note">
    Your Student / Letter ID is mentioned on the official document or letter issued by SoftGrowTech. Enter the same ID above to verify your document details.
  </p>

  <button type="submit" class="btn btn-primary">
    Verify Document →
  </button>

</div>
