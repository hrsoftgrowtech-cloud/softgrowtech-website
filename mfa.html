<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Authenticator Verification | SoftGrowTech</title>
<link rel="icon" href="assets/softgrowtech-logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="portal-body">
<main class="portal-wrap"><div style="max-width:520px;margin:55px auto"><div class="portal-card">
<div class="portal-kicker">Secure Admin Access</div>
<h1 id="title">Authenticator Setup</h1>
<p id="intro">Secure your Management Console with an authenticator app.</p>
<div id="error" style="color:#b91c1c;margin:12px 0"></div>
<section id="setup" hidden>
<p><strong>Step 1:</strong> Scan this QR code using the authenticator app on <strong>your own phone</strong>.</p>
<img id="qr" alt="Authenticator QR code" style="width:240px;max-width:100%;display:block;margin:16px auto">
<p><strong>Manual setup key:</strong><br><code id="secret" style="word-break:break-all"></code></p>
<p><strong>Step 2:</strong> Enter the 6-digit code generated by your authenticator app.</p>
</section>
<section id="verifySection">
<div class="field"><label>Authenticator Code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
<button class="portal-btn primary" id="verify">Verify & Continue →</button>
</section>
<button class="portal-btn secondary" id="logout" style="margin-top:10px">Cancel & Logout</button>
</div></div></main>
<script>
const SGT_URL='https://syoqukavgvrdhwxatdav.supabase.co';
const SGT_KEY='sb_publishable_yUuacAdfZy3k-_Zve5QOZA_6eLh9FeZ';
const sb=window.supabase.createClient(SGT_URL,SGT_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let factorId=null;
function fail(msg){$('error').textContent=msg||'Unable to continue.';$('verify').disabled=false;$('verify').textContent='Verify & Continue →'}
async function init(){
 try{
  const {data:{session},error:se}=await sb.auth.getSession();
  if(se||!session) throw Error('Admin session expired. Please sign in again.');
  const {data:userData,error:ue}=await sb.auth.getUser();
  if(ue||!userData?.user) throw Error('Unable to verify your account.');
  const {data:member,error:me}=await sb.from('sgt_admin_members').select('id,email,role,active').eq('user_id',userData.user.id).eq('active',true).maybeSingle();
  if(me||!member) throw Error('This account is not authorized for the Management Console.');
  const {data:factors,error:fe}=await sb.auth.mfa.listFactors();
  if(fe) throw fe;
  const totps=factors?.totp||[];
  const verified=totps.find(f=>f.status==='verified');
  if(verified){
    factorId=verified.id;
    $('title').textContent='Authenticator Verification';
    $('intro').textContent='Enter the 6-digit code from the authenticator app on your phone.';
    $('setup').hidden=true;
    return;
  }
  // A previous setup attempt can leave an unverified factor behind. Supabase
  // will then reject a new enrollment with a friendly-name conflict. Remove
  // only stale/unverified TOTP factors and create one fresh setup factor.
  for(const pending of totps.filter(f=>f.status!=='verified')){
    const removed=await sb.auth.mfa.unenroll({factorId:pending.id});
    if(removed.error) throw removed.error;
  }
  const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'SoftGrowTech Admin'});
  if(error) throw error;
  factorId=data.id;
  $('setup').hidden=false;
  $('qr').src=data.totp.qr_code;
  $('secret').textContent=data.totp.secret;
  $('title').textContent='Set Up Authenticator';
  $('intro').textContent='This one-time setup is for this Team Admin/Founder account. Scan the QR code with your own phone.';
 }catch(e){fail(e.message)}
}
$('verify').onclick=async()=>{
 const code=$('code').value.trim();
 if(!/^\d{6}$/.test(code))return fail('Enter the 6-digit authenticator code.');
 $('verify').disabled=true;$('verify').textContent='Verifying…';$('error').textContent='';
 try{
  const ch=await sb.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;
  const vr=await sb.auth.mfa.verify({factorId,challengeId:ch.data.id,code});if(vr.error)throw vr.error;
  sessionStorage.setItem('sgt_admin_entry_path','./');
  location.href='./management-console-x7.html';
 }catch(e){fail(e.message||'Invalid authenticator code.');}
};
$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./admin-login.html'};
$('code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
init();
</script>
</body></html>
