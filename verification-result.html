<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Result | SoftGrowTech</title>
<meta name="description" content="Official SoftGrowTech document verification result.">
<link rel="icon" href="assets/softgrowtech-logo.png">
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8fc;color:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.verification-result-page{min-height:100vh;padding:34px 18px 48px}
.result-shell{width:min(1080px,100%);margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 16px 50px rgba(15,23,42,.12);border:1px solid #e2e8f0}
.result-header{background:#061a33;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.result-brand{display:flex;align-items:center;gap:12px}.result-brand img{width:48px;height:48px;object-fit:contain;border-radius:10px;background:#fff}.result-brand strong{display:block;font-size:21px}.result-brand span{display:block;font-size:12px;opacity:.82;margin-top:2px}
.result-official{display:flex;align-items:center;gap:10px}.result-official strong{display:block;font-size:14px}.result-official small{display:block;font-size:11px;opacity:.8;margin-top:3px}.shield{width:38px;height:38px;border:2px solid #3b82f6;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#60a5fa;font-weight:800;font-size:20px}
.result-main{padding:30px}.verified-title{display:flex;justify-content:center;align-items:center;text-align:left;gap:13px;margin-bottom:24px}.verified-icon{width:50px;height:50px;min-width:50px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;box-shadow:0 8px 22px rgba(34,197,94,.22)}.verified-title h1{margin:0;font-size:27px;line-height:1.2}.verified-title p{margin:7px 0 0;color:#475569;font-size:13px}
.student-grid{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #e2e8f0;border-radius:13px;overflow:hidden;margin-bottom:20px}.student-grid>div{padding:17px 18px;border-right:1px solid #e2e8f0}.student-grid>div:last-child{border-right:0}.student-grid small{display:block;color:#64748b;font-size:11px;margin-bottom:6px}.student-grid strong{font-size:15px;word-break:break-word}
.status-section{background:var(--status-bg);border:1px solid color-mix(in srgb,var(--status) 25%,white);border-radius:14px;padding:20px;margin-bottom:18px}.status-label{display:inline-block;background:var(--status);color:#fff;padding:8px 13px;border-radius:6px;font-size:12px;font-weight:800;margin-bottom:18px}.status-content{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:center}.overall-circle{width:190px;height:190px;margin:auto;border-radius:50%;background:#fff;border:1px solid #dbeafe;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}.overall-check{width:48px;height:48px;border-radius:50%;background:#e2f7e8;color:var(--status);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;margin-bottom:7px}.overall-circle small{color:#475569;font-size:11px}.overall-circle strong{color:var(--status);font-size:18px;margin-top:4px}.overall-circle p{margin:7px 0 0;color:#64748b;font-size:10px;max-width:135px;line-height:1.35}.document-status h2{margin:0 0 12px;font-size:18px}.doc-row{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:13px 14px;margin-top:9px}.doc-row strong{display:block;font-size:14px}.doc-row small{display:block;color:#64748b;font-size:12px;margin-top:4px;line-height:1.35}.badge{white-space:nowrap;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:800}.badge.green{background:#dcfce7;color:#15803d}.badge.yellow{background:#fef3c7;color:#b45309}.badge.red{background:#fee2e2;color:#b91c1c}
.running-note{padding:13px 15px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;color:#1e3a8a;font-size:12px;margin-bottom:18px}.congratulations{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:11px;margin-bottom:18px}.congrats-icon{width:42px;height:42px;min-width:42px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.congratulations strong{font-size:15px;color:#1d4ed8}.congratulations p{margin:4px 0 0;font-size:12px;color:#475569}.certificate-help{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px;border:1px solid #fed7aa;background:#fff7ed;border-radius:11px;margin-bottom:20px}.mini-action{font-weight:800;color:#c2410c;text-decoration:none;font-size:13px}.help-inline{display:flex;align-items:center;gap:8px;color:#475569;font-size:12px}.whatsapp-icon{width:35px;height:35px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}.whatsapp-icon svg{width:20px;height:20px}.result-actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}.result-actions .result-button{margin:0}.result-actions .download-record{border:0;cursor:pointer;font:inherit}.result-actions .download-record:disabled{opacity:.7;cursor:wait}.result-button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:360px;margin:8px auto 0;padding:13px 18px;border-radius:9px;background:#061a33;color:#fff;text-decoration:none;font-size:13px;font-weight:800;transition:transform .2s,box-shadow .2s}.result-button:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(6,26,51,.2)}.result-bottom-line{text-align:center;color:#64748b;font-size:11px;margin:10px 0 0}.invalid-result{text-align:center;padding:55px 25px}.invalid-icon{width:62px;height:62px;margin:0 auto 16px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:800}.invalid-result h1{margin:0 0 10px;font-size:25px;color:#991b1b}.invalid-result p{max-width:620px;margin:0 auto;color:#7f1d1d;font-size:14px;line-height:1.55}.invalid-result small{display:block;margin-top:10px;color:#64748b}.entered-id{display:inline-block;margin:16px 0 4px;padding:8px 12px;border-radius:7px;background:#f8fafc;border:1px solid #e2e8f0;color:#64748b;font-size:11px}.result-loading{text-align:center;padding:80px 20px}.result-spinner{width:58px;height:58px;margin:0 auto 20px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:softgrowSpin 1s linear infinite}.result-loading h2{margin:0 0 7px;font-size:21px}.result-loading p{margin:0;color:#64748b;font-size:13px}
.verification-trust-strip{width:min(1080px,100%);margin:14px auto 0;padding:18px 20px;background:#f8fbff;border:1px solid #dbe7f5;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.trust-item{display:flex;align-items:center;gap:10px;min-width:0}.trust-icon{width:40px;height:40px;min-width:40px;border-radius:50%;background:#eaf2ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}.trust-item strong{display:block;font-size:12px;color:#0f172a}.trust-item span{display:block;font-size:10px;color:#64748b;line-height:1.35;margin-top:3px}.verification-copyright{width:min(1080px,100%);margin:0 auto;background:#061a33;color:#fff;text-align:center;padding:15px 10px;font-size:11px;border-radius:0 0 10px 10px;box-shadow:0 8px 20px rgba(6,26,51,.12)}
@media(max-width:760px){.verification-result-page{padding:14px 10px 28px}.result-header{padding:16px}.result-main{padding:18px}.verified-title{justify-content:flex-start}.verified-title h1{font-size:21px}.student-grid{grid-template-columns:1fr}.student-grid>div{border-right:0;border-bottom:1px solid #e2e8f0}.student-grid>div:last-child{border-bottom:0}.status-content{grid-template-columns:1fr}.overall-circle{width:175px;height:175px}.doc-row{flex-direction:column;align-items:flex-start}.badge{white-space:normal}.certificate-help{flex-direction:column;align-items:flex-start}.result-official{width:100%}.student-grid{grid-template-columns:1fr}.result-actions{flex-direction:column}.result-actions .result-button{width:100%;max-width:360px}.verification-trust-strip{grid-template-columns:1fr 1fr;padding:14px}.verification-copyright{border-radius:0 0 10px 10px}}
</style>
</head>
<body>
<main class="verification-result-page">
  <div id="verificationResult"></div>
<div id="verificationTrust"></div>
</main>
<script src="script.js"></script>
</body>
</html>

<style>
@media print {
  .download-record, .verify-another, .result-bottom-line { display:none !important; }
  body { background:#fff !important; }
}
</style>
