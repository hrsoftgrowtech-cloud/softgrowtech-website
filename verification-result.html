<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Result | SoftGrowTech</title>
<meta name="description" content="Official SoftGrowTech document verification result.">
<link rel="icon" href="assets/softgrowtech-logo.png">
<link rel="stylesheet" href="styles.css">
<style>
  .verification-result-body{background:#f8fafc;min-height:100vh;padding:0 16px 48px}
  #verificationResultPage{width:min(1100px,100%);margin:0 auto}
  .result-page-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 45px rgba(15,23,42,.10);animation:resultFadeUp .5s ease both}
  @keyframes resultFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .result-header{background:#061a33;color:#fff;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .result-brand,.official-badge{display:flex;align-items:center;gap:12px}
  .result-brand img{width:48px;height:48px;object-fit:contain;border-radius:10px}
  .brand-name{font-size:23px;font-weight:850;line-height:1.1}
  .brand-tagline{font-size:13px;color:#cbd5e1;margin-top:3px}
  .official-badge{gap:10px}
  .shield-icon{width:40px;height:44px;display:grid;place-items:center;color:#60a5fa;font-size:22px;font-weight:800;border:2px solid #2563eb;border-radius:12px 12px 16px 16px;clip-path:polygon(50% 0,92% 16%,86% 70%,50% 100%,14% 70%,8% 16%)}
  .official-badge strong,.official-badge span{display:block}
  .official-badge strong{font-size:15px}
  .official-badge span{font-size:12px;color:#cbd5e1;margin-top:2px}
  .result-main{padding:28px 30px 32px;background:#fff}
  .verified-heading{text-align:center;margin-bottom:22px}
  .verified-check{width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:#22c55e;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:850;box-shadow:0 8px 22px rgba(34,197,94,.20)}
  .verified-heading h1{margin:0;color:#0f172a;font-size:30px;line-height:1.2}
  .verified-heading p{margin:8px 0 0;color:#475569;font-size:14px}
  .student-record{display:grid;grid-template-columns:1.25fr 1fr 1.15fr .8fr;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px rgba(15,23,42,.05);margin-bottom:22px;background:#fff}
  .record-item{padding:18px;border-right:1px solid #e2e8f0;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .record-item:last-child{border-right:0}
  .record-item span{display:block;color:#64748b;font-size:12px;margin-bottom:6px}
  .record-item strong{color:#0f172a;font-size:16px;word-break:break-word;line-height:1.35}
  .record-id{flex-direction:row;align-items:center;gap:12px}
  .record-id strong{color:#1d4ed8}
  .record-icon{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:#eff6ff;display:grid;place-items:center;color:#2563eb}
  .record-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .result-status-card{position:relative;border-radius:15px;padding:22px;margin-bottom:18px;overflow:hidden}
  .running-card{border:1px solid #bbf7d0;background:#f0fdf4}
  .completed-card{border:1px solid #bfdbfe;background:#eff6ff}
  .not-issued-card{border:1px solid #fed7aa;background:#fffaf5}
  .status-ribbon{display:inline-block;color:#fff;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:850;margin-bottom:18px}
  .green-ribbon{background:#16a34a}.blue-ribbon{background:#2563eb}.orange-ribbon{background:#ea580c}
  .status-grid{display:grid;grid-template-columns:minmax(180px,.75fr) minmax(0,2fr);gap:24px;align-items:center}
  .overall-circle{min-height:190px;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;margin:auto;border:1px solid rgba(148,163,184,.20);background:rgba(255,255,255,.78)}
  .green-circle{color:#15803d}.blue-circle{color:#1d4ed8}.orange-circle{color:#dc2626}
  .overall-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px;font-size:27px;font-weight:850}
  .green-circle .overall-icon{background:#dcfce7}.blue-circle .overall-icon{background:#dbeafe}.orange-circle .overall-icon{background:#ffedd5}
  .overall-circle span{color:#475569;font-size:12px;margin-bottom:5px}
  .overall-circle strong{font-size:20px;line-height:1.08;color:currentColor}
  .overall-circle small{color:#475569;font-size:12px;line-height:1.45;max-width:175px;margin-top:8px}
  .document-area h2{margin:0 0 13px;color:#0f172a;font-size:18px}
  .document-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px;background:#fff;border-radius:11px;margin-bottom:9px;box-shadow:0 3px 12px rgba(15,23,42,.03)}
  .running-card .document-row{border:1px solid #dcfce7}.completed-card .document-row{border:1px solid #dbeafe}.not-issued-card .document-row{border:1px solid #fed7aa}
  .document-left{display:flex;align-items:center;gap:13px;min-width:0}
  .document-left>div:last-child{min-width:0}
  .document-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:0 0 48px}
  .offer-doc{background:#dcfce7;color:#16a34a}.certificate-doc{background:#fef3c7;color:#eab308}.not-issued-card .certificate-doc{background:#fee2e2;color:#ef4444}
  .document-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .document-left strong{display:block;color:#0f172a;margin-bottom:4px;font-size:15px}
  .document-left span{display:block;color:#64748b;font-size:13px;line-height:1.45}
  .document-badge{white-space:nowrap;padding:8px 11px;border-radius:7px;font-size:12px;font-weight:750}
  .verified{background:#dcfce7;color:#15803d}.coming{background:#fef3c7;color:#b45309}.not-verified{background:#fee2e2;color:#dc2626}
  .note-strip{padding:14px 16px;background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;color:#1e3a8a;font-size:13px;margin-top:10px}
  .congratulations-box{display:flex;align-items:center;gap:13px;margin-top:10px;padding:14px 16px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;color:#166534}
  .congrats-icon{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#dcfce7;display:grid;place-items:center;font-weight:850}
  .congratulations-box strong{display:block;font-size:15px}.congratulations-box p{margin-top:2px;font-size:13px;color:#166534}
  .help-strip{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:10px;padding:13px 16px;border:1px solid #fecaca;background:#fff1f2;border-radius:10px}
  .certificate-link{display:inline-flex;align-items:center;gap:6px;color:#dc2626;border:1px solid #dc2626;border-radius:7px;padding:8px 13px;font-size:13px;font-weight:800;background:#fff}
  .certificate-link:hover{background:#fff7f7;transform:translateY(-1px)}
  .certificate-link span{transition:transform .2s ease}.certificate-link:hover span{transform:translateX(3px)}
  .help-contact{display:flex;align-items:center;gap:8px;color:#475569;font-size:13px;font-weight:700}
  .whatsapp-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#16a34a;background:#dcfce7;border:1px solid #bbf7d0;transition:transform .2s ease,box-shadow .2s ease}
  .whatsapp-icon:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(22,163,74,.20)}
  .whatsapp-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .certificate-mini-link{display:inline-flex!important;align-items:center;gap:5px;margin-top:7px;color:#dc2626!important;font-size:12px!important;font-weight:800!important}
  .result-actions{text-align:center;padding-top:8px}
  .result-primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:11px;background:#2563eb;color:#fff;padding:13px 19px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(37,99,235,.18);transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
  .result-primary-btn:hover{transform:translateY(-2px);background:#1d4ed8;box-shadow:0 12px 26px rgba(37,99,235,.22)}
  .result-primary-btn:active{transform:translateY(1px) scale(.975)}
  .result-primary-btn span{transition:transform .2s ease}.result-primary-btn:hover span{transform:translateX(4px)}
  .result-actions p{margin:10px 0 0;color:#64748b;font-size:12px}
  .result-shell{width:min(720px,100%);margin:70px auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:50px 30px;text-align:center;box-shadow:0 14px 45px rgba(15,23,42,.10);animation:resultFadeUp .5s ease both}
  .result-invalid-icon,.result-error-icon{width:66px;height:66px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:30px;font-weight:850}
  .result-invalid-icon{background:#fee2e2;color:#dc2626}.result-error-icon{background:#fef3c7;color:#b45309}
  .result-shell h1{margin:0 0 10px;color:#0f172a;font-size:27px}.result-shell p{color:#64748b;font-size:14px;line-height:1.65;max-width:560px;margin:0 auto}
  .entered-id{display:inline-block;margin-top:16px;padding:8px 13px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px}
  .result-shell .result-primary-btn{margin-top:22px}
  @media(max-width:800px){
    .student-record{grid-template-columns:repeat(2,1fr)}
    .record-item:nth-child(2){border-right:0}.record-item:nth-child(-n+2){border-bottom:1px solid #e2e8f0}
    .status-grid{grid-template-columns:1fr}.overall-circle{width:min(210px,75vw)}
  }
  @media(max-width:560px){
    .verification-result-body{padding:0 10px 34px}
    .result-header,.result-main{padding-left:18px;padding-right:18px}
    .result-header{align-items:flex-start}.official-badge{margin-left:auto}
    .student-record{grid-template-columns:1fr}.record-item{border-right:0!important;border-bottom:1px solid #e2e8f0!important}.record-item:last-child{border-bottom:0!important}
    .record-id{flex-direction:row}.status-ribbon{font-size:11px}.document-row{align-items:flex-start;flex-direction:column}.document-badge{align-self:flex-start}.help-strip{flex-direction:column;align-items:flex-start}.help-contact{align-self:flex-end}
    .result-shell{margin:35px auto;padding:40px 20px}.result-shell h1{font-size:23px}
  }
</style>
</head>
<body class="verification-result-body">
  <div id="verificationResultPage"></div>
  <script src="script.js"></script>
</body>
</html>
