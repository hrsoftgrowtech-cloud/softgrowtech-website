<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin Security Setup | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="portal-body"><main class="portal-wrap"><div style="max-width:520px;margin:50px auto"><div class="portal-card"><div class="portal-kicker">Security</div><h1>Set Up Authenticator Verification</h1><p>Your management account requires two-factor authentication. This is a one-time setup. After setup, the password alone will not complete an Admin Panel login.</p><div id="setupState"><p>Preparing secure setup…</p></div><div class="field" style="margin-top:14px"><label>Authenticator Code</label><input id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code"></div><div class="admin-action-row" style="margin-top:14px"><button class="portal-btn primary" id="verifyMfa">Verify &amp; Continue</button><button class="portal-btn secondary" id="cancelMfa">Sign Out</button></div><p id="mfaMessage" class="help-note" style="margin-top:14px"></p></div></div></main><script>
const SGT_URL='https://syoqukavgvrdhwxatdav.supabase.co',SGT_KEY='sb_publishable_yUuacAdfZy3k-_Zve5QOZA_6eLh9FeG';
const sb=window.supabase.createClient(SGT_URL,SGT_KEY);let factor=null,challengeId=null;
const state=document.getElementById('setupState'),msg=document.getElementById('mfaMessage');
(async()=>{try{const {data:{user}}=await sb.auth.getUser();if(!user)throw Error('Please sign in again.');const {data:member,error:me}=await sb.from('sgt_admin_members').select('role,active').eq('user_id',user.id).eq('active',true).maybeSingle();if(me||!member||!['founder','team_admin'].includes(String(member.role).toLowerCase()))throw Error('This account is not authorized for management access.');const {data,error}=await sb.auth.mfa.listFactors();if(error)throw error;const existing=data?.totp?.find(x=>x.status==='verified');if(existing){factor=existing;state.innerHTML='<p>Your authenticator is already registered. Enter the current 6-digit code.</p>';const ch=await sb.auth.mfa.challenge({factorId:factor.id});if(ch.error)throw ch.error;challengeId=ch.data.id;return;}const en=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'SoftGrowTech Management'});if(en.error)throw en.error;factor=en.data;state.innerHTML='<p><strong>1.</strong> Scan this QR code in Google Authenticator, Microsoft Authenticator, Authy or another TOTP app.</p><img alt="Authenticator QR code" style="width:230px;max-width:100%;margin:10px 0" src="'+factor.totp.qr_code+'"><p><strong>Manual setup key:</strong><br><code style="word-break:break-all">'+factor.totp.secret+'</code></p><p><strong>2.</strong> Enter the 6-digit code generated by your authenticator.</p>';}catch(e){state.innerHTML='<p class="status danger">'+String(e.message||'Security setup failed.').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p>';document.getElementById('verifyMfa').disabled=true;}})();
document.getElementById('verifyMfa').onclick=async()=>{try{const code=document.getElementById('mfaCode').value.trim();if(!/^\d{6}$/.test(code))throw Error('Enter the 6-digit authenticator code.');if(!factor)throw Error('Authenticator setup is not ready.');if(!challengeId){const ch=await sb.auth.mfa.challenge({factorId:factor.id});if(ch.error)throw ch.error;challengeId=ch.data.id;}const vr=await sb.auth.mfa.verify({factorId:factor.id,challengeId,code});if(vr.error)throw vr.error;location.href='management-console-x7.html';}catch(e){msg.textContent=e.message||'Verification failed.';}};
document.getElementById('cancelMfa').onclick=async()=>{await sb.auth.signOut();location.href='admin-login.html';};
</script></body></html>
