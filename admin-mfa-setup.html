<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin Security Setup | SoftGrowTech</title><link rel="icon" href="assets/softgrowtech-logo.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="icons.css">
</head><body class="portal-body"><main class="portal-wrap"><div style="max-width:560px;margin:50px auto"><div class="portal-card"><div class="portal-kicker">Security</div><h1>Set Up Authenticator Verification</h1><p>This is a one-time setup for your management account. Scan the QR code with Google Authenticator, Microsoft Authenticator, Authy, or another TOTP app. After setup, your password alone will not complete an Admin Panel login.</p><div id="setupState"><p>Preparing secure setup…</p></div><div class="field" style="margin-top:14px"><label>Authenticator Code</label><input id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code"></div><div class="admin-action-row" style="margin-top:14px"><button class="portal-btn primary" id="verifyMfa">Verify &amp; Continue</button><button class="portal-btn secondary" id="signOut">Sign Out</button></div><p id="mfaMessage" class="help-note" style="margin-top:14px"></p></div></div></main><script>
const SGT_URL='https://syoqukavgvrdhwxatdav.supabase.co',SGT_KEY='sb_publishable_yUuacAdfZy3k-_Zve5QOZA_6eLh9FeG';
const sb=window.supabase.createClient(SGT_URL,SGT_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state=document.getElementById('setupState'),msg=document.getElementById('mfaMessage'),verifyBtn=document.getElementById('verifyMfa');
let factor=null,challengeId=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function showError(text){state.innerHTML='<p class="status danger">'+esc(text)+'</p><p style="margin-top:12px"><a class="portal-btn secondary" href="admin-login.html">Return to Admin Login</a></p>';verifyBtn.disabled=true;}
async function prepare(){
  try{
    let handoff=null;
    try{
      const raw=sessionStorage.getItem('sgt_admin_mfa_handoff');
      if(raw){const parsed=JSON.parse(raw);if(parsed?.access_token&&parsed?.refresh_token)handoff=parsed;}
    }catch(e){}

    // Prefer the fresh login handoff over a possibly stale persisted browser session.
    let session=null;
    if(handoff){
      const restored=await sb.auth.setSession({access_token:handoff.access_token,refresh_token:handoff.refresh_token});
      if(!restored.error&&restored.data?.session)session=restored.data.session;
    }
    if(!session){
      const got=await sb.auth.getSession();
      if(got.error)throw got.error;
      session=got.data?.session||null;
    }
    if(!session){showError('Your admin login session is missing or has expired. Please return to Admin Login and sign in again.');return;}

    // Give the Supabase client a moment to commit the restored session before asking the Auth server for the user.
    await new Promise(r=>setTimeout(r,150));
    let user=null;
    let userError=null;
    const firstUser=await sb.auth.getUser(session.access_token);
    user=firstUser.data?.user||null;
    userError=firstUser.error||null;

    // If the access token is stale, refresh it and retry with the new token.
    if(!user){
      const refreshed=await sb.auth.refreshSession();
      if(!refreshed.error&&refreshed.data?.session){
        session=refreshed.data.session;
        const retry=await sb.auth.getUser(session.access_token);
        user=retry.data?.user||null;
        userError=retry.error||null;
      }
    }

    // One final retry from the fresh login handoff prevents a stale local-storage session from blocking first-time MFA setup.
    if(!user&&handoff){
      const restoredAgain=await sb.auth.setSession({access_token:handoff.access_token,refresh_token:handoff.refresh_token});
      if(!restoredAgain.error&&restoredAgain.data?.session){
        session=restoredAgain.data.session;
        const retry=await sb.auth.getUser(session.access_token);
        user=retry.data?.user||null;
        userError=retry.error||null;
      }
    }
    if(!user)throw Error(userError?.message||'Your admin login session is no longer valid. Please sign in again.');

    try{sessionStorage.removeItem('sgt_admin_mfa_handoff')}catch(e){}
    let memberResult=await sb.from('sgt_admin_members').select('role,active').eq('user_id',user.id).eq('active',true).maybeSingle();
    if(memberResult.error)throw memberResult.error;
    const member=memberResult.data;
    if(!member||!['founder','team_admin'].includes(String(member.role).toLowerCase()))throw Error('This account is not authorized for management access.');
    const lf=await sb.auth.mfa.listFactors();
    if(lf.error)throw lf.error;
    const all=[...(lf.data?.totp||[])];
    const verified=all.find(x=>x.status==='verified');
    if(verified){factor=verified;state.innerHTML='<p>Your authenticator is already registered. Enter the current 6-digit code to continue.</p>';return;}
    const unverified=all.find(x=>x.status==='unverified');
    if(unverified){
      const removed=await sb.auth.mfa.unenroll({factorId:unverified.id});
      if(removed.error)throw removed.error;
    }
    const en=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'SoftGrowTech Management'});
    if(en.error)throw en.error;
    factor=en.data;
    state.innerHTML='<p><strong>1.</strong> Scan this QR code with Google Authenticator, Microsoft Authenticator, Authy, or another TOTP app.</p><div style="text-align:center"><img alt="Authenticator QR code" style="width:230px;max-width:100%;margin:10px 0" src="'+esc(factor.totp.qr_code)+'"></div><p><strong>Manual setup key:</strong><br><code style="word-break:break-all">'+esc(factor.totp.secret)+' </code></p><p><strong>2.</strong> Enter the 6-digit code generated by your authenticator.</p>';
  }catch(e){showError(e.message||'Security setup failed.');}
}
verifyBtn.onclick=async()=>{try{msg.textContent='';const code=document.getElementById('mfaCode').value.trim();if(!/^\d{6}$/.test(code))throw Error('Enter the 6-digit authenticator code.');if(!factor)throw Error('Authenticator setup is not ready.');const ch=await sb.auth.mfa.challenge({factorId:factor.id});if(ch.error)throw ch.error;const vr=await sb.auth.mfa.verify({factorId:factor.id,challengeId:ch.data.id,code});if(vr.error)throw vr.error;location.href='management-console-x7.html';}catch(e){msg.textContent=e.message||'Verification failed.';}};
document.getElementById('signOut').onclick=async()=>{await sb.auth.signOut();location.href='admin-login.html';};
prepare();
</script></body></html>
