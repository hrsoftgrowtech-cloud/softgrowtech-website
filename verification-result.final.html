s:center;gap:12px;min-width:0}.document-icon{width:46px;height:46px;min-width:46px;border-radius:11px;display:flex;align-items:center;justify-content:center}.offer-doc{background:#dcfce7;color:#16a34a}.certificate-doc{background:#fef3c7;color:#d97706}.document-left strong{display:block;font-size:14px}.document-left span{display:block;color:#64748b;font-size:12px;margin-top:4px;line-height:1.35}.document-badge{white-space:nowrap;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:800}.document-badge.verified{background:#dcfce7;color:#15803d}.document-badge.coming{background:#fef3c7;color:#b45309}.document-badge.not-verified{background:#fee2e2;color:#b91c1c}.note-strip{padding:13px 15px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;color:#1e3a8a;font-size:12px;margin-top:18px}.congratulations-box{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:11px;margin-top:18px}.congrats-icon{width:42px;height:42px;min-width:42px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.congratulations-box strong{font-size:15px;color:#1d4ed8}.congratulations-box p{margin:4px 0 0;font-size:12px;color:#475569}.help-strip{display:flex;justify-content:flex-end;margin-top:18px}.help-contact{display:flex;align-items:center;gap:9px;color:#475569;font-size:12px}.whatsapp-icon{width:35px;height:35px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}.whatsapp-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.certificate-mini-link{display:inline-flex!important;align-items:center;gap:6px;margin-top:8px;padding:8px 12px;border:1px solid #dc2626;border-radius:7px;color:#c2410c!important;text-decoration:none;font-weight:800;background:#fff}.result-actions{text-align:center;margin:22px auto 0;padding-top nd:#f8fafc;border:1px solid #e2e8f0;color:#64748b;font-size:11px}.result-error-shell .result-primary-btn,.result-invalid-shell .result-primary-btn{margin-top:20px}.verification-result-page{min-height:100vh;padding:34px 18px 48px;background:#f5f8fc}.verification-result-page .result-primary-btn{cursor:pointer}.verification-result-page .result-primary-btn span,.verification-result-page .result-download-btn span{font-size:16px}@media(max-width:800px){.student-record{grid-template-columns:1fr 1fr}.record-item:nth-child(2){border-right:0}.record-item:nth-child(3),.record-item:nth-child(4),.record-item:nth-child(5){border-top:1px solid #e2e8f0}.status-grid{grid-template-columns:1fr}.overall-circle{width:175px;height:175px}.trust-details{grid-template-columns:1fr 1fr}.result-download-btn{margin:0 0 8px}.result-primary-btn,.result-download-btn{width:100%;max-width:360px}.document-row{flex-direction:column;align-items:flex-start}.document-badge{white-space:normal}}@media(max-width:520px){.verification-result-page{padding:14px 10px 28px}.result-main{padding:18px}.result-header{padding:16px}.verified-heading h1{font-size:21px}.student-record{grid-template-columns:1fr}.record-item{border-right:0!important;border-top:1px solid #e2e8f0}.record-item:first-child{border-top:0}.trust-details{grid-template-columns:1fr}.official-badge{width:100%}.status-ribbon{margin:-18px 0 18px -18px}.result-footer{margin-top:14px}}
