async function submitJoinRequest(){const client=await ensureSupabase();const name=document.getElementById('joinName').value.trim(),email=document.getElementById('joinEmail').value.trim().toLowerCase(),phone=document.getElementById('joinPhone').value.trim();if(!name||!email||!phone){document.getElementById('joinMessage').textContent='Please enter your name, Gmail and WhatsApp number.';return}if(!client){document.getElementById('joinMessage').textContent='Secure service is temporarily unavailable. Please try again.';return}const joinSubmit=document.getElementById('joinSubmit');joinSubmit.disabled=true;joinSubmit.textContent='Sending…';const {data,error}=await client.rpc('sgt_submit_referral_join_request',{p_name:name,p_email:email,p_phone:phone});if(error||!data||data.error){document.getElementById('joinMessage').textContent=error?.message||data?.error||'Unable to submit your request right now.';joinSubmit.disabled=false;joinSubmit.textContent='Request to Join';return}document.getElementById('joinForm').innerHTML='<div class="join-success unlock-pop">✓ Request submitted successfully.<br><small>Your request has been sent to the SoftGrowTech Referral Program team. You will receive partner access if approved.</small></div>'}
function showLanding(){const root=document.getElementById('referralRoot');root.innerHTML=`<div class="ref-access-wrap"><div class="ref-access-card referral-landing unlock-pop"><div class="ref-access-glow"></div><div class="ref-access-icon">${icon('target')}</div><div class="portal-kicker">OFFICIAL SOFTGROWTECH PROGRAM</div><h1>Referral Program</h1><p class="ref-sub">Share the SoftGrowTech opportunity with genuine students, track your referrals and build your contribution from one professional dashboard.</p><div class="ref-benefit-grid"><div class="ref-benefit"><b class="icon-inline">${icon('link')} Share &amp; Track</b><span>Use your personal referral link and see registrations connected to you.</span></div><div class="ref-benefit"><b class="icon-inline">${icon('gift')} Achievement Badges</b><span>Unlock cumulative recognition badges as successful referrals grow.</span></div><div class="ref-benefit"><b class="icon-inline">${icon('target')} See Your Progress</b><span>Follow referral status and your current progress in one place.</span></div></div><div class="ref-token-box"><label for="portalToken">Enter Your Referral Token</label><input id="portalToken" class="ref-token-input" inputmode="text" maxlength="12" autocomplete="one-time-code" placeholder="SGT-12345678"><div class="ref-security-note">🔐 <span>Your token is issued by SoftGrowTech after your referral-partner access is created.</span></div><p id="portalMessage" class="help-note" style="color:#b91c1c;min-height:20px"></p><button class="portal-btn primary ref-access-btn" id="unlockPortal" type="button">Access My Referral Dashboard →</button><div class="ref-unlock-note">Your token only opens the referral dashboard associated with that partner account.</div></div><div class="ref-join-cta"><div><strong>Want to join the Referral Program?</strong><p>Request partner access and start building your referral contribution.</p></div><button class="portal-btn" id="showJoin" type="button">✨ Join Referral Program</button></div><div id="joinBox" class="join-box" hidden><div class="portal-kicker">REQUEST TO JOIN</div><h2>Become a SoftGrowTech Referral Partner</h2><p>Submit your details. The SoftGrowTech team will review the request before creating your partner access.</p><form id="joinForm"><div class="form-grid"><div class="field"><label>Name</label><input id="joinName" required placeholder="Your full name"></div><div class="field"><label>Gmail</label><input id="joinEmail" type="email" required placeholder="name@gmail.com"></div><div class="field full"><label>WhatsApp Number</label><input id="joinPhone" required placeholder="Your WhatsApp number"></div></div><p id="joinMessage" class="help-note"></p><button class="portal-btn primary ref-access-btn" id="joinSubmit" type="button">Request to Join →</button></form></div></div></div>`;
document.getElementById('unlockPortal').onclick=()=>unlock(document.getElementById('portalToken').value);document.getElementById('portalToken').addEventListener('keydown',e=>{if(e.key==='Enter')unlock(e.target.value)});document.getElementById('showJoin').onclick=()=>{const b=document.getElementById('joinBox');b.hidden=!b.hidden;if(!b.hidden)b.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('joinSubmit').onclick=submitJoinRequest}
async function unlock(raw){const client=await ensureSupabase();const token=String(raw||'').trim().toUpperCase(),msg=document.getElementById('portalMessage'),btn=document.getElementById('unlockPortal');if(!/^SGT-\d{8}$/.test(token)){msg.textContent='Please enter your 8-digit SGT token, for example SGT-12345678.';return}if(!client){msg.textContent='Secure service is temporarily unavailable. Please try again.';return}btn.disabled=true;btn.textContent='Verifying secure access…';const {data,error}=await client.rpc('sgt_get_referral_portal',{p_token:token});if(error||!data||data.error){msg.textContent=error?.message||data?.error||'Invalid or inactive referral token.';btn.disabled=false;btn.textContent='Access My Referral Dashboard →';return}loadDashboard(data)}
function loadDashboard(data){const root=document.getElementById('referralRoot'),refs=Array.isArray(data.referrals)?data.referrals:[],n=Number(data.successful_registrations||0),b=badgeFor(n),next=nextBadge(n),progress=next?Math.min(100,Math.round(n/next.at*100)):100,referralLink=`${location.origin}/?invite=${encodeURIComponent(data.referral_code)}`;root.innerHTML=`<div class="ref-hero unlock-pop"><div class="ref-top"><div><div class="portal-kicker icon-inline">${icon('ambassador')} My Referral Portal</div><h1 style="margin:5px 0">Welcome, ${esc(data.name)}</h1><p style="margin:0;color:#64748b">Your official SoftGrowTech referral workspace.</p></div><div class="ref-badge">${icon(b.icon)} ${esc(b.title)}</div></div><div class="badge-spotlight badge-pop"><div class="badge-orb">${icon(b.icon)}</div><div><small>Achievement Badge</small><h2>${esc(b.title)}</h2><p>${esc(b.text)}</p></div></div><div class="ref-position" style="margin-top:18px"><div><small style="color:#64748b">Successful referrals</small><h2>${n} Successful Referrals</h2><p>Only valid, uniquely attributed registrations count toward successful referral progress. Removed or invalid registrations do not count.</p></div><div class="progress-box"><div class="progress-label"><span>Next badge</span><strong>${next?`${n} / ${next.at}`:'All badges unlocked'}</strong></div><div class="progress-track"><span style="width:${progress}%"></span></div><small>${next?`${next.at-n} more successful referral${next.at-n===1?'':'s'} to unlock ${next.title}`:'Keep building your impact.'}</small></div></div><div class="ref-stats"><div class="ref-stat"><small>Successful Referrals</small><strong>${n}</strong></div><div class="ref-stat"><small>Current Badge</small><strong style="font-size:20px" class="icon-inline">${icon(b.icon)} ${esc(b.title)}</strong></div><div class="ref-stat"><small>Referrals Tracked</small><strong>${refs.length}</strong></div></div></div><div class="ref-nav"><button class="active" data-ref-tab="overview">${icon('dashboard')} Overview</button><button data-ref-tab="referrals">${icon('users')} My Referrals</button><button data-ref-tab="more">${icon('megaphone')} Get More Referrals</button></div><section class="ref-view active" data-ref-view="overview"><div class="portal-card"><div class="portal-section-title"><div><h2>${icon('share')} Your Referral Link</h2><p>Share this official SoftGrowTech link with genuine students.</p></div></div><div class="ref-link"><input id="myReferralLink" value="${esc(referralLink)}" readonly><button class="portal-btn primary" id="copyReferral">${icon('copy')} Copy Link</button><button class="portal-btn secondary" id="shareReferral">${icon('share')} Share</button></div><div class="ref-rule"><strong>What counts as a successful referral?</strong><p>A successful referral is a valid, uniquely attributed registration that completes the required registration flow and remains valid under the program rules. Visits, incomplete registrations, duplicates and removed/expired registrations do not count.</p></div></div></section><section class="ref-view" data-ref-view="referrals"><div class="portal-card"><div class="portal-section-title"><div><h2>${icon('users')} Referral Tracking</h2><p>See the students who came through your referral link and their current status.</p></div></div><div class="ref-table"><table><thead><tr><th>Student</th><th>Registration</th><th>Payment</th><th>Selection</th><th>Referral Status</th><th>Date</th></tr></thead><tbody>${refs.map(r=>`<tr><td><strong>${esc(r.student_name||'Student')}</strong><br><small>${esc(r.student_id||'')}</small></td><td>${esc(r.registration_status||'Registered')}</td><td>${esc(r.payment_status||'—')}</td><td>${esc(r.selection_status||'—')}</td><td>${esc(r.referral_status||'Active')}</td><td>${r.created_at?new Date(r.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—'}</td></tr>`).join('')||'<tr><td colspan="6">No referrals yet. Share your link to get started.</td></tr>'}</tbody></table></div></div></section><section class="ref-view" data-ref-view="more"><div class="portal-card"><div class="portal-section-title"><div><h2>${icon('megaphone')} Get More Referrals</h2><p>Keep sharing accurately and genuinely.</p></div></div><div class="ref-guide"><div class="ref-guide-item"><strong>${icon('linkedin')} LinkedIn</strong><p>Share the opportunity with relevant students and include your referral link.</p></div><div class="ref-guide-item"><strong>${icon('instagram')} Instagram</strong><p>Use a Story, Reel or post and share the official link.</p></div><div class="ref-guide-item"><strong>${icon('whatsapp')} WhatsApp</strong><p>Share personally with classmates, friends and juniors without spam.</p></div><div class="ref-guide-item"><strong>${icon('users')} College Network</strong><p>Reach genuine students who may benefit from the program.</p></div><div class="ref-guide-item"><strong>${icon('bulb')} Keep It Genuine</strong><p>Do not promise guaranteed selection, jobs or earnings and do not use fake accounts.</p></div></div><button class="portal-btn primary" id="copyGuideLink" style="margin-top:18px">${icon('copy')} Copy Referral Link</button></div></section>`;root.querySelectorAll('[data-ref-tab]').forEach(b=>b.onclick=()=>{root.querySelectorAll('[data-ref-tab]').forEach(x=>x.classList.remove('active'));root.querySelectorAll('[data-ref-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');root.querySelector(`[data-ref-view="${b.dataset.refTab}"]`)?.classList.add('active')});root.querySelector('#copyReferral').onclick=async()=>{try{await navigator.clipboard.writeText(referralLink);toast('Referral link copied.')}catch(_){toast('Copy failed.')}};root.querySelector('#copyGuideLink').onclick=async()=>{try{await navigator.clipboard.writeText(referralLink);toast('Referral link copied.')}catch(_){toast('Copy failed.')}};root.querySelector('#shareReferral').onclick=async()=>{if(navigator.share)try{await navigator.share({title:'SoftGrowTech Referral Program',text:'Join SoftGrowTech through my referral link:',url:referralLink})}catch(_){}else{try{await navigator.clipboard.writeText(referralLink);toast('Referral link copied.')}catch(_){}}}}
showLanding();
</script></body></html>
